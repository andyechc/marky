<!doctype html>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="2mSJyLCHh-70ZD78kDCfjG3n0jIO2SbzDjkoUp7hWR0" />

    <!--
      Applies the saved theme before the first paint. Without this, a user on
      the dark theme sees a white flash while React boots, because the theme
      would otherwise only be applied in an effect after mount.
    -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('marky:settings')
          var theme = raw ? JSON.parse(raw).theme : null
          if (theme !== 'dark' && theme !== 'sepia' && theme !== 'light') {
            // First visit: follow the OS preference.
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          var root = document.documentElement
          root.dataset.theme = theme
          if (theme === 'dark') root.classList.add('dark')
          root.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        } catch (error) {
          // Private mode or blocked storage: fall back to the light theme.
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <!-- SEO Meta Tags -->
